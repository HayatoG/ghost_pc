<svg xmlns="http://www.w3.org/2000/svg" width="820" height="518" viewBox="0 0 820 518" role="img" aria-labelledby="t d">
<title id="t">Ganho medido por mudanca (razao, maior e melhor)</title><desc id="d">Cada barra vem de um teste proprio, em momentos diferentes; nao se multiplicam. Cache de VFS: sem ganho.</desc>
<style>
.t{font:600 18px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a} .s{font:13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#6e7781}
.l{font:13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a} .v{font:600 13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a}
.p{font:italic 12px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#8c959f}
.ax{stroke:#8c959f;stroke-width:1} .gr{stroke:#8c959f;stroke-opacity:.25;stroke-width:1}
.pend{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 4}
@media (prefers-color-scheme: dark){.t,.l,.v{fill:#c9d1d9} .s,.p{fill:#8b949e}}
</style>
