<text x="290.0" y="264.0" class="l" text-anchor="end" >VU1 nativo (gameplay)</text>
<rect x="300.0" y="249" width="129.0" height="22" rx="3" class="pend"/>
<text x="310.0" y="264.0" class="p" text-anchor="start" >[PENDENTE]</text>
