<text x="290.0" y="120.0" class="l" text-anchor="end" >VU1 interpretador (minimo)</text>
<rect x="300.0" y="105" width="372.3" height="22" rx="3" fill="#0072B2"><title>VU1 interpretador (minimo): 3,00 x</title></rect>
<text x="678.3" y="120.0" class="v" text-anchor="start" >3,00 x</text>
<text x="290.0" y="156.0" class="l" text-anchor="end" >VU1 interpretador (maximo)</text>
<rect x="300.0" y="141" width="409.5" height="22" rx="3" fill="#0072B2"><title>VU1 interpretador (maximo): 3,30 x</title></rect>
<text x="715.5" y="156.0" class="v" text-anchor="start" >3,30 x</text>
<text x="290.0" y="192.0" class="l" text-anchor="end" >Rasterizador CPU (replay)</text>
<rect x="300.0" y="177" width="253.2" height="22" rx="3" fill="#0072B2"><title>Rasterizador CPU (replay): 2,04 x</title></rect>
<text x="559.2" y="192.0" class="v" text-anchor="start" >2,04 x</text>
