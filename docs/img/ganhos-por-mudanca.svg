<svg xmlns="http://www.w3.org/2000/svg" width="820" height="338" viewBox="0 0 820 338" role="img" aria-labelledby="t d">
<title id="t">Ganho medido por mudanca (razao, maior e melhor)</title><desc id="d">Cada barra vem de um teste proprio (harness, replay ou corrida); nao se multiplicam.</desc>
<style>
.t{font:600 18px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a} .s{font:13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#6e7781}
.l{font:13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a} .v{font:600 13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a}
.p{font:italic 12px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#8c959f}
.ax{stroke:#8c959f;stroke-width:1} .gr{stroke:#8c959f;stroke-opacity:.25;stroke-width:1}
.pend{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 4}
@media (prefers-color-scheme: dark){.t,.l,.v{fill:#c9d1d9} .s,.p{fill:#8b949e}}
</style>
<text x="20.0" y="28.0" class="t" text-anchor="start" >Ganho medido por mudanca (razao, maior e melhor)</text>
<text x="20.0" y="48.0" class="s" text-anchor="start" >Cada barra vem de um teste proprio (harness, replay ou corrida); nao se multiplicam.</text>
<rect x="20.0" y="59.0" width="14" height="14" rx="3" fill="#0072B2"/>
<text x="40.0" y="70.0" class="l" text-anchor="start" >Harness ou replay isolado</text>
<rect x="226.0" y="59.0" width="14" height="14" rx="3" fill="#E69F00"/>
<text x="246.0" y="70.0" class="l" text-anchor="start" >Corrida inteira</text>
<line x1="300.0" x2="300.0" y1="98" y2="314" class="gr"/>
<text x="300.0" y="330.0" class="s" text-anchor="middle" >0</text>
<line x1="424.1" x2="424.1" y1="98" y2="314" class="gr"/>
<text x="424.1" y="330.0" class="s" text-anchor="middle" >1</text>
<line x1="548.2" x2="548.2" y1="98" y2="314" class="gr"/>
<text x="548.2" y="330.0" class="s" text-anchor="middle" >2</text>
<line x1="672.3" x2="672.3" y1="98" y2="314" class="gr"/>
