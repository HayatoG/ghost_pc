<line x1="300.0" x2="300.0" y1="98" y2="278" class="gr"/>
<text x="300.0" y="294.0" class="s" text-anchor="middle" >0</text>
<line x1="441.6" x2="441.6" y1="98" y2="278" class="gr"/>
<text x="441.6" y="294.0" class="s" text-anchor="middle" >100</text>
<line x1="583.1" x2="583.1" y1="98" y2="278" class="gr"/>
<text x="583.1" y="294.0" class="s" text-anchor="middle" >200</text>
<line x1="724.7" x2="724.7" y1="98" y2="278" class="gr"/>
<text x="724.7" y="294.0" class="s" text-anchor="middle" >300</text>
<text x="290.0" y="120.0" class="l" text-anchor="end" >Baseline CPU</text>
<rect x="300.0" y="105" width="409.5" height="22" rx="3" fill="#0072B2"><title>Baseline CPU: 289 s</title></rect>
<text x="715.5" y="120.0" class="v" text-anchor="start" >289 s</text>
<text x="290.0" y="156.0" class="l" text-anchor="end" >CPU serial</text>
<rect x="300.0" y="141" width="253.1" height="22" rx="3" fill="#E69F00"><title>CPU serial: 179 s</title></rect>
<text x="559.1" y="156.0" class="v" text-anchor="start" >179 s</text>
<text x="290.0" y="192.0" class="l" text-anchor="end" >CPU em faixas</text>
