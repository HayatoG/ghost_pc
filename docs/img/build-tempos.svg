<svg xmlns="http://www.w3.org/2000/svg" width="820" height="338" viewBox="0 0 820 338" role="img" aria-labelledby="t d">
<title id="t">Tempo de build (escala logaritmica)</title><desc id="d">Escala log: cada divisao e 10x. Menor e melhor. O rebuild completo continua inevitavel uma vez; o ganho e no ciclo de edicao.</desc>
<style>
.t{font:600 18px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a} .s{font:13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#6e7781}
.l{font:13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a} .v{font:600 13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#57606a}
.p{font:italic 12px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#8c959f}
.ax{stroke:#8c959f;stroke-width:1} .gr{stroke:#8c959f;stroke-opacity:.25;stroke-width:1}
.pend{fill:none;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 4}
@media (prefers-color-scheme: dark){.t,.l,.v{fill:#c9d1d9} .s,.p{fill:#8b949e}}
</style>
<text x="20.0" y="28.0" class="t" text-anchor="start" >Tempo de build (escala logaritmica)</text>
<text x="20.0" y="48.0" class="s" text-anchor="start" >Escala log: cada divisao e 10x. Menor e melhor. O rebuild completo continua inevitavel uma vez; o ganho e no ciclo de edicao.</text>
<rect x="20.0" y="59.0" width="14" height="14" rx="3" fill="#0072B2"/>
<text x="40.0" y="70.0" class="l" text-anchor="start" >Antes</text>
<rect x="82.0" y="59.0" width="14" height="14" rx="3" fill="#E69F00"/>
<text x="102.0" y="70.0" class="l" text-anchor="start" >Depois</text>
<line x1="360.9" x2="360.9" y1="98" y2="314" class="gr"/>
<text x="360.9" y="330.0" class="s" text-anchor="middle" >10 s</text>
<line x1="555.5" x2="555.5" y1="98" y2="314" class="gr"/>
<text x="555.5" y="330.0" class="s" text-anchor="middle" >100 s</text>
<text x="290.0" y="120.0" class="l" text-anchor="end" >Tocar 1 .cpp de gs</text>
<rect x="300.0" y="105" width="92.9" height="22" rx="3" fill="#0072B2"><title>Tocar 1 .cpp de gs: 14,6 s</title></rect>
<text x="398.9" y="120.0" class="v" text-anchor="start" >14,6 s</text>
<text x="290.0" y="156.0" class="l" text-anchor="end" >Editar header comum</text>
<rect x="300.0" y="141" width="422.4" height="22" rx="3" fill="#0072B2"><title>Editar header comum: 720 s</title></rect>
<text x="728.4" y="156.0" class="v" text-anchor="start" >720 s</text>
<text x="290.0" y="192.0" class="l" text-anchor="end" >Rebuild completo</text>
<rect x="300.0" y="177" width="425.9" height="22" rx="3" fill="#0072B2"><title>Rebuild completo: 750 s</title></rect>
<text x="731.9" y="192.0" class="v" text-anchor="start" >750 s</text>
<text x="290.0" y="228.0" class="l" text-anchor="end" >Tocar 1 .cpp de gs (depois)</text>
<rect x="300.0" y="213" width="129.0" height="22" rx="3" class="pend"/>
