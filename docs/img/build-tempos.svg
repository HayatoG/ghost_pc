<text x="290.0" y="300.0" class="l" text-anchor="end" >Rebuild completo (depois, uma vez)</text>
<rect x="300.0" y="285" width="425.9" height="22" rx="3" fill="#E69F00"><title>Rebuild completo (depois, uma vez): 750 s</title></rect>
<text x="731.9" y="300.0" class="v" text-anchor="start" >750 s</text>
