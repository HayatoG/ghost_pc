<text x="20.0" y="28.0" class="t" text-anchor="start" >Gameplay 3D: vsync por segundo por configuracao</text>
<text x="20.0" y="48.0" class="s" text-anchor="start" >Janela de vsync acumulado 7530-7640; alvo 50 vsync/s. Quanto maior, melhor.</text>
